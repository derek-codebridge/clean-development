name: Feature request
description: Propose an adapter or focused product change
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which files are scattered, by which tool, and why are they safe to route?
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Upstream storage contract
      description: Link primary documentation for the environment variable, flag, or API.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and ownership risks
      description: Note credentials, config, final artifacts, project-local consumers, and concurrent processes.
    validations:
      required: true
